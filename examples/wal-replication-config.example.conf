# PostgreSQL WAL & Replication Slot Configuration Reference
# Annotated for environments using logical replication on Windows Server
#
# Context: paired with pg-wal-slot-monitor.ps1 for PG12 deployments.
# On PG13+ you can use max_slot_wal_keep_size as a hard cap instead of
# (or in addition to) the monitor script.
#
# Sanitized — internal paths and port numbers removed.

# ---------------------------------------------------------------------------
# WAL level — must be 'logical' to use logical replication slots
# ---------------------------------------------------------------------------
wal_level = logical

# ---------------------------------------------------------------------------
# WAL size management
# ---------------------------------------------------------------------------
max_wal_size = 1GB          # checkpoint target — not a hard cap on pg_wal size
min_wal_size = 80MB

wal_compression = on        # reduces pg_wal segment disk usage
wal_recycle = on            # reuse WAL segment files instead of deleting/recreating

# ---------------------------------------------------------------------------
# Replication slot limits
# ---------------------------------------------------------------------------
max_wal_senders = 6         # maximum concurrent WAL sender processes
max_replication_slots = 4   # maximum number of replication slots

# ---------------------------------------------------------------------------
# PG13+ only — hard cap on WAL retained per slot
# On PG12 this parameter does not exist; use pg-wal-slot-monitor.ps1 instead.
# ---------------------------------------------------------------------------
# max_slot_wal_keep_size = 1GB

# ---------------------------------------------------------------------------
# Notes on orphaned slot risk
# ---------------------------------------------------------------------------
# A replication slot that becomes inactive (subscriber disconnected or
# decommissioned) will cause PostgreSQL to retain WAL indefinitely until the
# slot is dropped. This can exhaust disk space on the pg_wal volume.
#
# Mitigation options by PostgreSQL version:
#
#   PG12:  schedule pg-wal-slot-monitor.ps1 via Task Scheduler to detect and
#          drop inactive orphaned slots when retention exceeds a safe threshold.
#
#   PG13+: set max_slot_wal_keep_size to cap retention per slot. The monitor
#          script can still run as a secondary alert layer.
#
# Safe diagnostic queries:
#
#   -- Check slot retention
#   SELECT slot_name, active,
#          pg_size_pretty(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)) AS retained
#   FROM pg_replication_slots
#   ORDER BY retained DESC;
#
#   -- Check WAL directory size
#   SELECT pg_size_pretty(sum(size)) FROM pg_ls_waldir();  -- PG10+
