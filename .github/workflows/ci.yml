name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse check PowerShell scripts and tests
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts, tests -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { throw "PowerShell AST parse failed." }

      - name: Run unit tests on PowerShell 7 (pwsh)
        shell: pwsh
        run: ./tests/test-recovery.ps1

      - name: Run unit tests on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\test-recovery.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run PSScriptAnalyzer (Error severity gate)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery
          }
          $findings = Invoke-ScriptAnalyzer -Path .\scripts -Recurse -Severity Error
          if ($findings) {
            $findings | Format-Table -AutoSize
            throw "PSScriptAnalyzer reported $($findings.Count) Error-level finding(s)."
          }
